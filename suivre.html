<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivre ma commande — SMARTJUICE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CODE ENTRY VIEW -->
  <div class="code-page" id="codeEntryView">
    <div class="code-card">
      <a class="logo" href="index.html">
        <span class="logo-icon">🥤</span>
        <span class="logo-text"><strong>SMART</strong><span>JUICE</span></span>
      </a>
      <h1>Suivre ma commande</h1>
      <p>Entres ton code pour voir l'état de ta commande en temps réel.</p>
      <form onsubmit="lookupCode(event)">
        <input type="text" class="code-input" id="codeInput" maxlength="7" placeholder="SJ-____" autocomplete="off" autofocus />
        <button type="submit" class="code-btn">VOIR →</button>
        <div class="code-error" id="codeError"></div>
      </form>
      <a href="index.html" class="code-back">← Retour au menu</a>
    </div>
  </div>

  <!-- TRACKING VIEW -->
  <div class="track-page" id="trackingView" style="display:none">
    <div class="track-header">
      <a class="logo" href="index.html">
        <span class="logo-icon">🥤</span>
        <span class="logo-text"><strong>SMART</strong><span>JUICE</span></span>
      </a>
      <span class="track-code-badge" id="trackCode">—</span>
    </div>
    <div class="track-title">
      <h1>Suivi de commande</h1>
      <p id="trackStatus">En attente...</p>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="track-order-info" id="orderInfo"></div>

    <!-- ACTIONS DE RETRAIT SI C'EST PRÊT -->
    <div class="track-ready-actions" id="readyActions" style="display:none; flex-direction:column; gap:10px; margin-top:20px;">
      <p style="text-align:center; font-weight:600; color:#333;">Comment récupères-tu ta commande ?</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="ready-btn yango" onclick="updateTransport('yango')">🚗 Mon Yango arrive</button>
        <button class="ready-btn self" onclick="updateTransport('self')">🚶 J'arrive moi-même</button>
      </div>
    </div>

    <!-- MESSAGE DE CONFIRMATION DE RETRAIT -->
    <div id="transportChoiceNotice" style="display:none; text-align:center; padding:12px; background:#e3f2fd; border-radius:8px; margin-top:15px; font-weight:600; color:#0d47a1;"></div>

    <a href="index.html" class="code-back" style="text-align:center;display:block;margin-top:20px">← Retour au menu</a>
  </div>

  <!-- NOT FOUND VIEW -->
  <div class="track-not-found" id="notFoundView" style="display:none">
    <h2>Code introuvable</h2>
    <p>Aucune commande trouvée avec ce code.</p>
    <a href="suivre.html" class="code-back" style="text-align:center;display:block;margin-top:20px">← Réessayer</a>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => n.toLocaleString('fr-FR') + ' F';

    const STEPS = [
      { key: 'new', icon: '✅', title: 'Commande reçue', desc: 'Ta commande est enregistrée' },
      { key: 'preparing', icon: '🔥', title: 'En préparation', desc: 'On cuisine pour toi' },
      { key: 'ready', icon: '📦', title: 'C\'est PRÊT !', desc: 'Choisis ton mode de récupération' },
      { key: 'out', icon: '🚗', title: 'En cours d\'expédition', desc: 'En route / Récupération' },
      { key: 'completed', icon: '🎉', title: 'Terminée', desc: 'Bon appétit !' },
    ];

    let currentOrder = null;
    let currentOrderId = null;
    let lastStatus = null;

    // Récupérer le code dans l'URL
    const params = new URLSearchParams(window.location.search);
    const urlCode = params.get('code') || params.get('id');

    if (urlCode) {
      startTracking(urlCode.toUpperCase().trim());
    }

    // Auto-formater le champ
    $('codeInput').addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    window.lookupCode = async (event) => {
      event.preventDefault();
      const code = $('codeInput').value.trim().toUpperCase();
      const error = $('codeError');
      if (!code) {
        error.textContent = 'Entre un code valide.';
        return;
      }
      error.textContent = '';
      startTracking(code);
    };

    function startTracking(code) {
      const q = query(collection(db, "orders"), where("tracking_code", "==", code));

      // Écoute en temps réel via Firebase
      onSnapshot(q, (snapshot) => {
        if (snapshot.empty) {
          $('codeEntryView').style.display = 'none';
          $('trackingView').style.display = 'none';
          $('notFoundView').style.display = 'block';
          return;
        }

        const docSnap = snapshot.docs[0];
        currentOrderId = docSnap.id;
        currentOrder = docSnap.data();

        const oldStatus = lastStatus;
        lastStatus = currentOrder.status;

        $('codeEntryView').style.display = 'none';
        $('notFoundView').style.display = 'none';
        $('trackingView').style.display = 'block';
        $('trackCode').textContent = currentOrder.tracking_code;

        renderTracking(currentOrder);

        // Déclencher alerte/son en cas de changement de statut
        if (oldStatus && oldStatus !== currentOrder.status) {
          playSound();
          vibrate();
          notify(currentOrder);
        }
      });

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function renderTracking(order) {
  const statusOrder = ['new', 'preparing', 'ready', 'completed'];
  const currentIdx = statusOrder.indexOf(order.status);

  const statusMap = { 
    new: 'Commande reçue', 
    preparing: 'En préparation', 
    ready: 'Prête !', 
    completed: 'Transaction terminée — Bon appétit ! 🎉' 
  };
  
  $('trackStatus').textContent = statusMap[order.status] || order.status;

  // Timeline
  $('timeline').innerHTML = STEPS.map((step, i) => {
    const done = i <= currentIdx;
    const active = i === currentIdx;
    return `
      <div class="timeline-step ${done ? 'done' : ''} ${active ? 'active' : ''}">
        <div class="timeline-icon">${step.icon}</div>
        <div class="timeline-content">
          <h3>${step.title}</h3>
          <p>${step.desc}</p>
        </div>
      </div>
    `;
  }).join('');

  // Mode de livraison (S'affiche EN HAUT des détails)
  const transportBadge = order.transport_label 
    ? `<div style="background:#e3f2fd; color:#0d47a1; padding:10px; border-radius:8px; font-weight:bold; text-align:center; margin-bottom:12px;">🛵 Transport : ${order.transport_label}</div>` 
    : '';

  // Détails de la commande
  const items = Array.isArray(order.items) ? order.items : [];
  $('orderInfo').innerHTML = `
    ${transportBadge}
    <h3>Détails de la commande</h3>
    <div class="track-items">
      ${items.map((i) => `<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
        <span>${i.qty}× ${i.name}</span>
        <span>${fmt((i.price || 0) * i.qty)}</span>
      </div>`).join('')}
    </div>
    <div class="track-total" style="margin-top:12px; font-weight:bold; border-top:1px solid #ddd; padding-top:8px; display:flex; justify-content:space-between;">
      <span>Total</span>
      <span>${fmt(order.total || 0)}</span>
    </div>
  `;

  // Actions de transport (visibles uniquement si 'ready' et pas encore choisi)
  if (order.status === 'ready' && !order.transport_mode) {
    $('readyActions').style.display = 'flex';
  } else {
    $('readyActions').style.display = 'none';
  }
}

      // Affichage des options de transport dès que c'est PRÊT
      if (order.status === 'ready' && !order.transport_mode) {
        $('readyActions').style.display = 'flex';
        $('transportChoiceNotice').style.display = 'none';
      } else if (order.transport_mode) {
        $('readyActions').style.display = 'none';
        $('transportChoiceNotice').style.display = 'block';
        $('transportChoiceNotice').textContent = order.transport_mode === 'yango' 
          ? '🚗 Information transmise : Vous avez indiqué qu’un Yango arrive !' 
          : '🚶 Information transmise : Vous avez indiqué venir chercher la commande vous-même !';
      } else {
        $('readyActions').style.display = 'none';
        $('transportChoiceNotice').style.display = 'none';
      }
    

    // TRANSMISSION DE L'INFO A FIREBASE / ADMIN PANEL
   window.updateTransport = async (mode) => {
  if (!currentOrderId) return;

  const transportText = mode === 'yango' ? 'Yango en route' : 'Client vient en personne';

  try {
    // On enregistre le mode de transport SANS changer le statut de la commande !
    await updateDoc(doc(db, "orders", currentOrderId), { 
      transport_mode: mode,
      transport_label: transportText
    });

    // Mettre à jour l'affichage sur la page du client
    $('readyActions').style.display = 'none';
    $('transportChoiceNotice').style.display = 'block';
    $('transportChoiceNotice').textContent = mode === 'yango' 
      ? '🚗 Information transmise : Vous avez indiqué qu’un Yango arrive !' 
      : '🚶 Information transmise : Vous avez indiqué venir chercher la commande vous-même !';

  } catch (error) {
    console.error("Erreur de mise à jour du transport :", error);
  }
};

    function playSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function vibrate() {
      if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
    }

    function notify(order) {
      if ('Notification' in window && Notification.permission === 'granted') {
        const statusMap = { new: 'Commande reçue', preparing: 'En préparation', ready: 'C\'est PRÊT !', out: 'En livraison / Retrait', completed: 'Terminée' };
        new Notification('SmartJuice 🥤', {
          body: `Statut de votre commande: ${statusMap[order.status] || order.status}`,
          icon: '🥤'
        });
      }
    }
  </script>
</body>
</html>
